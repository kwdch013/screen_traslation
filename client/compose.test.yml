services:
  test:
    build:
      context: ..
      dockerfile: client/Dockerfile.test
    init: true
    network_mode: none
    volumes:
      - ../contracts:/workspace/contracts:ro
    command:
      - dotnet
      - test
      - client/tests/ScreenTranslation.Contracts.Tests/ScreenTranslation.Contracts.Tests.csproj
      - --configuration
      - Release
      - --filter
      - Category=Contract
