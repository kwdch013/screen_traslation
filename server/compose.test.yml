services:
  test:
    build:
      context: ..
      dockerfile: server/Dockerfile
    init: true
    cpus: 2
    mem_limit: 4g
    network_mode: none
    volumes:
      - ../contracts:/workspace/contracts:ro
    command:
      - python
      - -B
      - -m
      - unittest
      - discover
      - -s
      - tests
      - -v
  # 実エンジン結合試験用のArgosモデルを取得する。外向き通信が必要なため、通常試験とは別に実行する。
  # 取得済み(サイズ・SHA-256検証済み)ならダウンロードを省略する。所要はdocs/v1.0/testing.mdを参照。
  prepare-model:
    profiles: [model]
    build:
      context: ..
      dockerfile: server/Dockerfile
    init: true
    cpus: 2
    mem_limit: 4g
    # プロジェクト専用ネットワークを作らず既定bridgeで外向き通信だけを行う
    network_mode: bridge
    environment:
      XDG_DATA_HOME: /models/xdg-data
      XDG_CACHE_HOME: /models/xdg-cache
    volumes:
      - argos-models:/models
    command: [python, -B, tests/integration/prepare_model.py, /models]
  integration:
    profiles: [integration]
    build:
      context: ..
      dockerfile: server/Dockerfile
    init: true
    cpus: 2
    mem_limit: 4g
    network_mode: none
    environment:
      SCREEN_TRANSLATION_TEST_MODEL_DIR: /models
      XDG_DATA_HOME: /models/xdg-data
      XDG_CACHE_HOME: /models/xdg-cache
    volumes:
      - argos-models:/models:ro
    command:
      - python
      - -B
      - -m
      - unittest
      - discover
      - -s
      - tests/integration
      - -p
      - "test_*.py"
      - -v

  # OCR処理時間の測定(2 CPU制限下。外部通信なし)。合否判定ではなく記録用。
  measure:
    profiles: [measure]
    build:
      context: ..
      dockerfile: server/Dockerfile
    init: true
    cpus: 2
    mem_limit: 4g
    network_mode: none
    command: [python, -B, tests/tools/measure_ocr_time.py, --pathological]

volumes:
  argos-models:
