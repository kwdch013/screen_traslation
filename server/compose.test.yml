services:
  test:
    build:
      context: ..
      dockerfile: server/Dockerfile
    init: true
    cpus: 2
    mem_limit: 4g
    network_mode: none
    volumes:
      - ../contracts:/workspace/contracts:ro
    command:
      - python
      - -B
      - -m
      - unittest
      - discover
      - -s
      - tests
      - -v
