name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

# 同じブランチへ連続 push したとき、古い実行を打ち切る
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# デフォルトを read-only にし、必要なジョブでだけ権限を足す
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: フロントエンドインフラ構成テスト (ホスト)
        run: PYTHONPATH=src python -m unittest src.tests.test_frontend_infrastructure

      - name: 文書整合テスト (ホスト)
        run: PYTHONPATH=src python -m unittest src.tests.test_web_documentation

      - name: デスクトップ撤去構成テスト (ホスト)
        run: PYTHONPATH=src python -m unittest src.tests.test_desktop_removal.DesktopRepositoryRemovalTest

      - name: Work Unit・Claim・AIレビューゲート検証 (Python 3.14コンテナ内)
        run: |
          docker build -f tests/ai_gate/Dockerfile -t ai-gate-test:ci .
          docker run --rm --cpus=2 -v "$PWD:/workspace:ro" ai-gate-test:ci

      - name: v1.0・現行Web文書整合テスト (Python 3.14コンテナ内)
        run: docker run --rm --cpus=2 --memory=512m -v "$PWD:/workspace:ro" -w /workspace ai-gate-test:ci python -B -m unittest src.tests.test_v1_documentation src.tests.test_web_documentation -v

      - name: 座標契約fixture検証 (リポジトリマウント付きコンテナ内)
        run: docker run --rm --cpus=2 --memory=512m -e PYTHONPATH=/workspace/src -v "$PWD:/workspace:ro" -w /workspace ai-gate-test:ci python -B -m unittest src.tests.test_dpi_coordinates -v

      - name: フロントエンド検証 (コンテナ内)
        run: docker build --target frontend-test --tag frontend-test:ci .

      - name: Lint (ruff)
        run: |
          pip install -r requirements-dev.txt
          ruff check src scripts tests/ai_gate

      # GitHub Actions キャッシュにレイヤを載せてビルド時間を短縮
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: イメージをビルド
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          tags: app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: mypy 構成テスト (コンテナ内)
        run: docker run --rm -e PYTHONPATH=/workspace/src -v "$PWD:/workspace" -w /workspace app:ci python -m unittest src.tests.test_mypy_infrastructure

      - name: 開発統合先構成テスト (コンテナ内)
        run: docker run --rm -e PYTHONPATH=/workspace/src -v "$PWD:/workspace:ro" -w /workspace app:ci python -B -m unittest src.tests.test_development_branch

      - name: 型チェック (mypy)
        run: docker run --rm -e PYTHONPATH=/app/src app:ci mypy src

      # 本番実行環境 (Windows) 向けの型定義でも整合することを確認する
      - name: 型チェック (mypy, Windows向け)
        run: docker run --rm -e PYTHONPATH=/app/src app:ci mypy --platform win32 src

      # ローカルの docker compose run --rm app と同一環境・同一コマンドでテストする
      - name: テスト実行 (コンテナ内)
        run: docker run --rm -e PYTHONPATH=/app/src app:ci python -m unittest discover -s src/tests
