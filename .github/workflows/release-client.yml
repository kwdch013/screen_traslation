name: Release Client (build only)

# Windowsクライアントの配布物をビルドしてartifactへ保存するところまで。
# GitHub Releaseの作成・公開は受入後のリリースTask (#111) で行い、このworkflowでは行わない。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "配布物の版 (例: 1.0.0 / 1.0.0-rc.1)"
        required: true
        type: string
  push:
    tags:
      - 'client-v*'

# 同じ版を並行して作らない。実行中のビルドは打ち切らず順に実行する
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: client/global.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # 入力・tag名はシェルへ直接埋め込まず環境変数で受け、版の形式はスクリプト側で検証する
      - name: 版を決める
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if ($env:REF_TYPE -eq 'tag') { $version = $env:REF_NAME -replace '^client-v', '' } else { $version = $env:INPUT_VERSION }
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$') { throw "版の形式が不正です。" }
          "CLIENT_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 自己完結配布物をビルド (win-x64)
        shell: pwsh
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: ./client/scripts/publish-client.ps1 -Version $env:CLIENT_VERSION -OutputDir artifacts -Commit $env:COMMIT_SHA

      - name: 配布物を検証 (チェックサム・manifest・秘密/固定接続先の混入)
        shell: pwsh
        run: python client/scripts/package_client.py verify --output-dir artifacts/package --version $env:CLIENT_VERSION

      - name: 配布物をartifactへ保存 (公開はしない)
        uses: actions/upload-artifact@v7
        with:
          name: screen-translation-client-${{ env.CLIENT_VERSION }}
          path: |
            artifacts/package/*.zip
            artifacts/package/SHA256SUMS
            artifacts/package/release-manifest.json
          if-no-files-found: error
          retention-days: 30
