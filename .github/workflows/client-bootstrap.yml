name: Client Bootstrap

on:
  pull_request:
    paths:
      - "client/**"
      - ".github/workflows/client-bootstrap.yml"
  push:
    branches: [develop]
    paths:
      - "client/**"
      - ".github/workflows/client-bootstrap.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: client/global.json
      - name: ソリューションをビルド
        working-directory: client
        run: dotnet build ScreenTranslation.sln --configuration Release
      - name: Coreテストを実行
        working-directory: client
        run: dotnet test tests/ScreenTranslation.Core.Tests/ScreenTranslation.Core.Tests.csproj --configuration Release --no-build
