name: CodeQL

on:
  pull_request:
  push:
    branches: [develop, main]
  schedule:
    - cron: "0 0 * * 1" # 毎週月曜。新規に公開された脆弱性を拾うため

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-python:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # 解析結果の書き込みに必要
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@v4

  analyze-csharp:
    runs-on: windows-latest
    permissions:
      contents: read
      security-events: write # 解析結果の書き込みに必要
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: client/global.json
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
      - name: Windows SolutionをビルドしてC#を抽出
        run: dotnet build client/ScreenTranslation.sln --configuration Release
      - uses: github/codeql-action/analyze@v4
