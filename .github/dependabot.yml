version: 2
updates:
  # ワークフローが参照する action のバージョン (SHA ピン留めも更新される)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Dockerfile のベースイメージ
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
